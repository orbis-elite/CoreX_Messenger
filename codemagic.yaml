workflows:
  ios-app-store:
    name: CoreX Messenger iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - appstore_credentials
      flutter: 3.24.0
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.corexmessenger.chat
        RELEASE_NAME: 1.5.9
        RELEASE_NUMBER: "29"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Verify release metadata
        script: |
          set -e
          grep -q '^version: 1.5.9+29$' pubspec.yaml
          grep -q 'MARKETING_VERSION = 1.5.9;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 29;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'WebRTC-SDK (144.7559.01)' ios/Podfile.lock

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install iOS pods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios
          pod install --repo-update

      - name: Analyze source
        script: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install signing certificate
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$RELEASE_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
