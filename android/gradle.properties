org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -Dkotlin.daemon.jvm.options=-Xmx3G

# -----------------------------------------------------------------------------
# ANDROID X
# -----------------------------------------------------------------------------

android.useAndroidX=true
android.enableJetifier=true

# -----------------------------------------------------------------------------
