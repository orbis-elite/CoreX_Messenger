name: corexchat

description: "CoreX Messenger"

# Prevent accidental publishing to pub.dev
publish_to: "none"

# Version & Build Number
# versionName (Android) / CFBundleShortVersionString (iOS)
# buildNumber (Android versionCode / iOS CFBundleVersion)
version: 1.3.0+22

environment:
  sdk: ">=3.3.4 <4.0.0"

# -------------------------------------------------------------------
# DEPENDENCIES
# -------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # -----------------------------------------------------------------
  # UI & DESIGN
  # -----------------------------------------------------------------

  cupertino_icons: ^1.0.8
  sizer: ^3.0.5
  lottie: ^3.1.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  page_transition: ^2.2.1
  percent_indicator: ^4.2.5
  readmore: ^3.0.0
  buttons_tabbar: ^1.3.15
  scroll_to_index: ^3.0.1
  visibility_detector: ^0.4.0+2

  # -----------------------------------------------------------------
  # STATE MANAGEMENT & UTILITIES
  # -----------------------------------------------------------------

  get: ^4.7.2
  logger: ^2.5.0
  intl: ^0.19.0
  timezone: ^0.10.0
  fluttertoast: ^8.2.12
  flutter_dotenv: ^5.2.1
  timeago: ^3.7.0

  # -----------------------------------------------------------------
  # STORAGE & CACHE
  # -----------------------------------------------------------------

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1

  # -----------------------------------------------------------------
  # NETWORKING
  # -----------------------------------------------------------------

  http: ^1.3.0
  dio: ^5.8.0+1
  internet_connection_checker: ^3.0.1
  socket_io_client: ^3.1.1

  # -----------------------------------------------------------------
  # MEDIA
  # -----------------------------------------------------------------

  image_picker: ^1.1.2
  video_player: ^2.9.5
  video_thumbnail: ^0.5.6
  flutter_image_compress: ^2.4.0
  audioplayers: ^6.4.0
  flutter_ringtone_player: ^4.0.0+4
  record: ^6.1.1

  # -----------------------------------------------------------------
  # FILES & DOCUMENTS
  # -----------------------------------------------------------------

  file_picker: ^8.3.7
  share_plus: ^10.1.4
  pdf: ^3.11.3
  pdf_render: ^1.4.12
  syncfusion_flutter_pdfviewer: ^28.2.12

  # -----------------------------------------------------------------
  # MAPS & LOCATION
  # -----------------------------------------------------------------

  google_maps_flutter: ^2.10.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # -----------------------------------------------------------------
  # FIREBASE
  # -----------------------------------------------------------------

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0

  # -----------------------------------------------------------------
  # WEBRTC / CALLING
  # -----------------------------------------------------------------

  flutter_webrtc: ^0.12.1
  peerdart: ^0.5.2

  # -----------------------------------------------------------------
  # WEBVIEW
  # -----------------------------------------------------------------

  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.18.4

  # -----------------------------------------------------------------
  # QR / OTP / SCANNER
  # -----------------------------------------------------------------

  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  flutter_otp_text_field: ^1.2.0
  pinput: ^5.0.1

  # -----------------------------------------------------------------
  # CONTACTS & URL
  # -----------------------------------------------------------------

  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0

  # -----------------------------------------------------------------
  # HTML / PREVIEW
  # -----------------------------------------------------------------

  flutter_html: ^3.0.0-beta.2
  flutter_link_previewer: ^3.2.2

  # -----------------------------------------------------------------
  # NOTIFICATIONS
  # -----------------------------------------------------------------

  onesignal_flutter: ^5.3.0

  # -----------------------------------------------------------------
  # COUNTRY / PHONE
  # -----------------------------------------------------------------

  country_code_picker: ^3.2.0

  # -----------------------------------------------------------------
  # STORIES / STATUS
  # -----------------------------------------------------------------

  story: ^1.1.0
  story_view: ^0.16.5

  # -----------------------------------------------------------------
  # GIPHY
  # -----------------------------------------------------------------

  enough_giphy_flutter: ^0.4.0

  # -----------------------------------------------------------------
  # IN APP PURCHASE
  # -----------------------------------------------------------------

  in_app_purchase: ^3.1.13

# -------------------------------------------------------------------
# DEPENDENCY OVERRIDES
# -------------------------------------------------------------------

dependency_overrides:

  intl: ^0.19.0

  # ---------------------------------------------------------------
  # CUSTOM WEBRTC
  # ---------------------------------------------------------------

  flutter_webrtc:
    git:
      url: https://github.com/packages-primocys/flutter_webrtc.git
      ref: master

  # ---------------------------------------------------------------
  # CUSTOM PLATFORM WIDGETS
  # ---------------------------------------------------------------

  flutter_platform_widgets:
    git:
      url: https://github.com/packages-primocys/flutter_platform_widgets_3.3.5.git

  enough_platform_widgets:
    git:
      url: https://github.com/packages-primocys/enough_platform_widgets_0.7.4.git

  # ---------------------------------------------------------------
  # CUSTOM COMPRESSOR
  # ---------------------------------------------------------------

  light_compressor:
    git:
      url: https://github.com/packages-primocys/light_compressor-2.2.0.git

  # ---------------------------------------------------------------
  # CUSTOM SIM COUNTRY CODE
  # ---------------------------------------------------------------

  flutter_sim_country_code:
    git:
      url: https://github.com/packages-primocys/flutter_sim_country_code-0.1.2.git

# -------------------------------------------------------------------
# DEV DEPENDENCIES
# -------------------------------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter

# -------------------------------------------------------------------
# FLUTTER CONFIG
# -------------------------------------------------------------------

flutter:

  uses-material-design: true

  # -----------------------------------------------------------------
  # ASSETS
  # -----------------------------------------------------------------

  assets:
    - assets/images/
    - assets/applogo/
    - assets/icons/
    - assets/Lottie ANIMATION/
    - assets/audio/
    - assets/

  # -----------------------------------------------------------------
  # FONTS
  # -----------------------------------------------------------------

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/K2D-Regular.ttf