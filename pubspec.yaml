# =============================================================================
# CoreX Messenger
# =============================================================================
#
# Production-Ready Flutter Configuration
#
# =============================================================================
#
# Optimized & Stabilized For:
#
# ✔ Flutter 3.24.x
# ✔ Dart 3.5.x
# ✔ Android SDK 35
# ✔ Java 17
# ✔ Kotlin 2.1.0
# ✔ Gradle 8.7
# ✔ AGP 8.6.0
# ✔ Codemagic CI/CD
# ✔ Google Play Store
# ✔ Apple App Store
# ✔ Android App Bundle (.aab)
# ✔ iOS IPA Build (.ipa)
# ✔ Firebase
# ✔ OneSignal
# ✔ WebRTC
# ✔ Legacy CoreX Messenger Source Compatibility
#
# =============================================================================
#
# IMPORTANT NOTES
#
# DO NOT randomly upgrade dependencies.
#
# This project uses several LEGACY packages and CUSTOM forks that are tightly
# connected with the original CoreX Messenger source code.
#
# Some packages are intentionally pinned to older versions because:
#
# - Source code still depends on old APIs
# - Some modern package versions BREAK the project
# - Some packages were customized by previous developers
# - WebRTC ecosystem is extremely sensitive to version mismatch
#
# =============================================================================

name: corexchat

description: "CoreX Messenger"

publish_to: "none"

# =============================================================================
# VERSIONING
# =============================================================================
#
# version: build_name+build_number
#
# Android:
# - build_name   = versionName
# - build_number = versionCode
#
# iOS:
# - build_name   = CFBundleShortVersionString
# - build_number = CFBundleVersion
#
# =============================================================================

version: 1.4.2+26

# =============================================================================
# DART SDK
# =============================================================================

environment:
  sdk: ">=3.5.0 <4.0.0"

# =============================================================================
# MAIN DEPENDENCIES
# =============================================================================

dependencies:

  # ---------------------------------------------------------------------------
  # FLUTTER SDK
  # ---------------------------------------------------------------------------

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # UI / DESIGN
  # ---------------------------------------------------------------------------

  cupertino_icons: ^1.0.6
  page_transition: ^2.0.9
  buttons_tabbar: ^1.3.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.2.2
  sizer: ^3.0.5
  percent_indicator: ^4.2.3
  readmore: ^3.0.0
  scroll_to_index: ^3.0.1
  visibility_detector: ^0.4.0+2

  # ---------------------------------------------------------------------------
  # ANIMATION
  # ---------------------------------------------------------------------------

  lottie: ^3.0.0

  # ---------------------------------------------------------------------------
  # STATE MANAGEMENT / HELPERS
  # ---------------------------------------------------------------------------

  get: ^4.6.5
  logger: ^2.5.0
  intl: ^0.19.0
  timezone: ^0.9.4
  fluttertoast: ^8.0.9
  flutter_dotenv: ^5.2.1
  timeago: ^3.6.1

  # ---------------------------------------------------------------------------
  # LOCAL STORAGE
  # ---------------------------------------------------------------------------

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  flutter_cache_manager: ^3.3.1

  # ---------------------------------------------------------------------------
  # NETWORKING
  # ---------------------------------------------------------------------------

  http: ^1.2.1
  dio: ^5.4.0
  internet_connection_checker: ^1.0.0+1
  socket_io_client: ^3.0.2

  # ---------------------------------------------------------------------------
  # MEDIA
  # ---------------------------------------------------------------------------

  image_picker: ^1.0.4
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  flutter_image_compress: ^2.1.0
  audioplayers: ^6.1.2
  flutter_ringtone_player: ^4.0.0+3

  # ---------------------------------------------------------------------------
  # AUDIO RECORDING
  # ---------------------------------------------------------------------------
  #
  # IMPORTANT:
  # Using old stable version because source code depends on legacy APIs:
  #
  # - Record()
  # - hasPermission()
  # - start()
  # - stop()
  # - dispose()
  #
  # Newer versions BREAK the project.
  #
  # ---------------------------------------------------------------------------

  record: ^4.4.4

  # ---------------------------------------------------------------------------
  # FILES / PDF
  # ---------------------------------------------------------------------------

  file_picker: ^8.1.7
  share_plus: ^10.1.4
  pdf: ^3.11.1
  pdf_render: ^1.4.10
  syncfusion_flutter_pdfviewer: ^20.4.54

  # ---------------------------------------------------------------------------
  # MAPS / LOCATION
  # ---------------------------------------------------------------------------

  google_maps_flutter: ^2.2.3
  geolocator: ^9.0.2
  geocoding: ^3.0.0
  google_maps_webservice: ^0.0.19

  # ---------------------------------------------------------------------------
  # PLACE PICKER
  # ---------------------------------------------------------------------------
  #
  # IMPORTANT:
  # Legacy-compatible place picker.
  #
  # Newer versions break:
  #
  # - PlacePicker()
  # - LocationResult
  #
  # ---------------------------------------------------------------------------

  place_picker: ^0.10.0

  # ---------------------------------------------------------------------------
  # FIREBASE
  # ---------------------------------------------------------------------------

  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_messaging: ^14.7.9
  firebase_dynamic_links: ^5.4.17

  # ---------------------------------------------------------------------------
  # NOTIFICATIONS
  # ---------------------------------------------------------------------------

  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.0.4

  # ---------------------------------------------------------------------------
  # WEBRTC / CALLING
  # ---------------------------------------------------------------------------

  flutter_webrtc:
    git:
      url: https://github.com/packages-primocys/flutter_webrtc.git

  peerdart: ^0.5.2

  # ---------------------------------------------------------------------------
  # WEBVIEW
  # ---------------------------------------------------------------------------

  webview_flutter: ^4.4.1

  # ---------------------------------------------------------------------------
  # QR / OTP
  # ---------------------------------------------------------------------------

  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  flutter_otp_text_field: ^1.1.1
  pinput: ^5.0.0

  # ---------------------------------------------------------------------------
  # CONTACT / URL
  # ---------------------------------------------------------------------------

  flutter_contacts: ^1.1.8
  url_launcher: ^6.1.7
  permission_handler: ^11.3.1

  # ---------------------------------------------------------------------------
  # HTML / LINK PREVIEW
  # ---------------------------------------------------------------------------

  flutter_html: ^3.0.0-beta.2

  # IMPORTANT:
  # Legacy-compatible link preview package.
  #
  # Newer versions break:
  #
  # - FlutterLinkPreview()
  # - WebInfo
  #
  # ---------------------------------------------------------------------------

  lecle_flutter_link_preview: ^0.0.1+3

  # ---------------------------------------------------------------------------
  # COUNTRY PICKER
  # ---------------------------------------------------------------------------

  country_calling_code_picker: ^2.0.1

  # ---------------------------------------------------------------------------
  # STORY / STATUS
  # ---------------------------------------------------------------------------

  story: ^1.1.0
  status_view: ^0.0.2

  # ---------------------------------------------------------------------------
  # GIPHY
  # ---------------------------------------------------------------------------

  giphy_get: ^3.4.1

  # ---------------------------------------------------------------------------
  # PURCHASE / SUBSCRIPTION
  # ---------------------------------------------------------------------------

  in_app_purchase: ^3.1.11
  in_app_purchase_storekit: ^0.3.6+4

  # ---------------------------------------------------------------------------
  # WINDOWS SUPPORT
  # ---------------------------------------------------------------------------

  win32: ^5.10.1

# =============================================================================
# DEPENDENCY OVERRIDES
# =============================================================================
#
# VERY IMPORTANT:
#
# These overrides are REQUIRED to keep compatibility with:
#
# - Flutter 3.24
# - Android SDK 35
# - AGP 8.6
# - Legacy CoreX Source Code
#
# Removing these may break build generation.
#
# =============================================================================

dependency_overrides:

  # ---------------------------------------------------------------------------
  # INTL FIX
  # ---------------------------------------------------------------------------

  intl: ^0.19.0

  # ---------------------------------------------------------------------------
  # EXTENDED IMAGE FIX
  # ---------------------------------------------------------------------------

  extended_image: 8.1.1

  # ---------------------------------------------------------------------------
  # HTTP
  # ---------------------------------------------------------------------------

  http: ^1.2.1

  # ---------------------------------------------------------------------------
  # GEOLOCATOR FIX
  # ---------------------------------------------------------------------------
  #
  # Prevents:
  # "Could not get unknown property 'flutter'"
  #
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # RECORD FIX
  # ---------------------------------------------------------------------------
  #
  # Prevents:
  # "Record is abstract"
  #
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # WEBRTC FIX
  # ---------------------------------------------------------------------------

  flutter_webrtc:
    git:
      url: https://github.com/packages-primocys/flutter_webrtc.git

  # ---------------------------------------------------------------------------
  # PLACE PICKER FIX
  # ---------------------------------------------------------------------------

  place_picker:
    git:
      url: https://github.com/packages-primocys/place_picker_0.10.0.git

  # ---------------------------------------------------------------------------
  # PLATFORM WIDGETS FIX
  # ---------------------------------------------------------------------------

  flutter_platform_widgets:
    git:
      url: https://github.com/packages-primocys/flutter_platform_widgets_3.3.5.git

  # ---------------------------------------------------------------------------
  # LIGHT COMPRESSOR FIX
  # ---------------------------------------------------------------------------

  light_compressor:
    git:
      url: https://github.com/packages-primocys/light_compressor-2.2.0.git

  # ---------------------------------------------------------------------------
  # SIM COUNTRY FIX
  # ---------------------------------------------------------------------------

  flutter_sim_country_code:
    git:
      url: https://github.com/packages-primocys/flutter_sim_country_code-0.1.2.git

# =============================================================================
# DEVELOPMENT DEPENDENCIES
# =============================================================================

dev_dependencies:

  flutter_test:
    sdk: flutter

# =============================================================================
# FLUTTER CONFIGURATION
# =============================================================================

flutter:

  uses-material-design: true

  # ---------------------------------------------------------------------------
  # ASSETS
  # ---------------------------------------------------------------------------

  assets:

    - assets/images/
    - assets/applogo/
    - assets/icons/
    - assets/Lottie ANIMATION/
    - assets/audio/
    - assets/

  # ---------------------------------------------------------------------------
  # FONTS
  # ---------------------------------------------------------------------------

  fonts:

    - family: Poppins

      fonts:
        - asset: assets/fonts/K2D-Regular.ttf

# =============================================================================
# END OF FILE
# =============================================================================